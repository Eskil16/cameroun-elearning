[build]
builder      = "nixpacks"
buildCommand = "bash build.sh"

[deploy]
preDeployCommand   = "python manage.py migrate --noinput && python init_db.py"
startCommand       = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"
healthcheckPath    = "/health/"
healthcheckTimeout = 30
restartPolicyType  = "on_failure"
