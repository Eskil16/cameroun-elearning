<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription — Réseau Académique Camerounais</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body style="background:#f0f2f5;">

<nav class="navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <span class="flag-cm"></span> Réseau <span>Académique</span>
    </a>
    <button class="lang-toggle" id="lang-toggle-btn">🇬🇧 EN</button>
  </div>
</nav>

<div style="padding:1rem;">
  <div class="form-card" style="max-width:520px;">
    <div class="text-center mb-3">
      <div style="font-size:2rem;">🇨🇲</div>
      <h1 data-i18n="nav.register">Inscription</h1>
      <p style="color:#666;font-size:.85rem;">
        <span data-i18n="auth.have_account">Déjà un compte ?</span>
        <a href="login.html" data-i18n="nav.login">Connexion</a>
      </p>
    </div>

    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div id="success-msg" class="alert alert-success d-none"></div>

    <form id="register-form" novalidate>
      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="form-label" for="first_name" data-i18n="auth.first_name">Prénom</label>
          <input type="text" id="first_name" class="form-control" required autocomplete="given-name"/>
        </div>
        <div class="col-6">
          <label class="form-label" for="last_name" data-i18n="auth.last_name">Nom</label>
          <input type="text" id="last_name" class="form-control" required autocomplete="family-name"/>
        </div>
      </div>

      <div class="mb-2">
        <label class="form-label" for="username" data-i18n="auth.username">Nom d'utilisateur</label>
        <input type="text" id="username" class="form-control" required autocomplete="username"
               pattern="[a-zA-Z0-9_]+" title="Lettres, chiffres et _ uniquement"/>
      </div>

      <div class="mb-2">
        <label class="form-label" for="email" data-i18n="auth.email">Email</label>
        <input type="email" id="email" class="form-control" required autocomplete="email"/>
      </div>

      <div class="mb-2">
        <label class="form-label" for="phone" data-i18n="auth.phone">Téléphone (optionnel)</label>
        <input type="tel" id="phone" class="form-control" autocomplete="tel"
               placeholder="+237 6XX XXX XXX"/>
      </div>

      <div class="mb-2">
        <label class="form-label" data-i18n="auth.role">Je suis</label>
        <select id="role" class="form-select">
          <option value="student" data-i18n="auth.role.student">Étudiant(e)</option>
          <option value="instructor" data-i18n="auth.role.instructor">Formateur/Formatrice</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label" data-i18n="auth.lang">Langue préférée</label>
        <select id="preferred_language" class="form-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label" for="password" data-i18n="auth.password">Mot de passe</label>
        <div class="position-relative">
          <input type="password" id="password" class="form-control" required
                 autocomplete="new-password" minlength="8"/>
          <button type="button" onclick="togglePwd('password')"
                  style="position:absolute;right:.5rem;top:.5rem;background:none;border:none;cursor:pointer;">👁</button>
        </div>
        <div class="form-text">Minimum 8 caractères / At least 8 characters</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password2" data-i18n="auth.confirm_password">Confirmer</label>
        <input type="password" id="password2" class="form-control" required
               autocomplete="new-password"/>
      </div>

      <!-- Indicateur force mot de passe -->
      <div class="mb-3">
        <div class="progress-track mb-1">
          <div class="progress-bar-cam" id="pwd-strength-bar" style="width:0;"></div>
        </div>
        <small id="pwd-strength-label" style="color:#666;"></small>
      </div>

      <button type="submit" class="btn-cam-primary w-100" id="submit-btn" data-i18n="auth.register_btn">
        S'inscrire
      </button>
    </form>

    <p class="text-center mt-3" style="font-size:.75rem;color:#888;">
      En vous inscrivant, vous acceptez les
      <a href="#">conditions d'utilisation</a> de la plateforme.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/offline-sync.js"></script>
<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  // Force mot de passe
  document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const bar = document.getElementById('pwd-strength-bar');
    const lbl = document.getElementById('pwd-strength-label');
    let score = 0;
    if (val.length >= 8)   score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^a-zA-Z0-9]/.test(val)) score++;
    const pct   = (score / 4) * 100;
    const colors = ['#ce1126','#fd7e14','#fcd116','#007a3d'];
    const labels = ['Très faible','Faible','Moyen','Fort'];
    bar.style.width = pct + '%';
    bar.style.background = colors[score - 1] || '#ddd';
    lbl.textContent = score > 0 ? labels[score - 1] : '';
  });

  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('error-msg');
    const okEl  = document.getElementById('success-msg');
    errEl.classList.add('d-none');
    okEl.classList.add('d-none');

    const password  = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      errEl.textContent = 'Les mots de passe ne correspondent pas. / Passwords do not match.';
      errEl.classList.remove('d-none');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = window.i18n.t('btn.loading');

    const payload = {
      first_name:         document.getElementById('first_name').value.trim(),
      last_name:          document.getElementById('last_name').value.trim(),
      username:           document.getElementById('username').value.trim(),
      email:              document.getElementById('email').value.trim(),
      phone_number:       document.getElementById('phone').value.trim(),
      preferred_language: document.getElementById('preferred_language').value,
      password,
      password2,
    };

    const res = await API.register(payload);
    btn.disabled = false;
    btn.textContent = window.i18n.t('auth.register_btn');

    if (res?.ok) {
      okEl.textContent = res.data?.message || 'Compte créé avec succès !';
      okEl.classList.remove('d-none');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } else {
      const errors = res?.data?.errors || res?.data;
      const msg = res?.data?.message || JSON.stringify(errors) || window.i18n.t('error.generic');
      errEl.textContent = msg;
      errEl.classList.remove('d-none');
    }
  });

  function togglePwd(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
