<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fil d'actualité — Réseau Académique Camerounais</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body style="background:#f0f2f5;">

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html"><span class="flag-cm"></span> Réseau <span>Académique</span></a>
    <div class="d-flex gap-2 align-items-center">
      <button class="lang-toggle" id="lang-toggle-btn">🇬🇧 EN</button>
      <a href="index.html" class="nav-link" style="color:#fff;">← Catalogue</a>
      <button onclick="API.logout()" class="btn-cam-secondary btn-sm" style="border-color:rgba(255,255,255,.3);color:#fff;">
        Déconnexion
      </button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width:680px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 style="font-size:1.2rem;font-weight:800;" data-i18n="feed.title">Fil d'actualité</h1>
    <button class="btn-cam-secondary btn-sm" onclick="loadFeed()">🔄</button>
  </div>

  <!-- Leaderboard sidebar (mobile: dessous) -->
  <div class="row g-3">
    <div class="col-lg-8">
      <div id="feed-loading" class="text-center py-4">
        <div class="spinner-border" style="color:#007a3d;"></div>
      </div>
      <div id="feed-container"></div>
      <div id="feed-empty" class="d-none sidebar-section text-center py-4">
        <div style="font-size:2.5rem;">🌱</div>
        <p data-i18n="feed.empty">Abonnez-vous à des formateurs pour voir leur actualité.</p>
        <a href="index.html" class="btn-cam-primary">Découvrir des cours</a>
      </div>
      <div class="text-center mt-3">
        <button class="btn-cam-secondary d-none" id="load-more-feed" onclick="loadMoreFeed()">
          Charger plus
        </button>
      </div>
    </div>

    <!-- Classement -->
    <div class="col-lg-4">
      <div class="sidebar-section">
        <h6>🏆 Classement / Leaderboard</h6>
        <div id="leaderboard-list">
          <div class="text-center"><div class="spinner-border spinner-border-sm" style="color:#007a3d;"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/offline-sync.js"></script>
<script src="js/api.js"></script>
<script>
  if (!Auth.isLoggedIn()) window.location.href = 'login.html?next=feed.html';

  let feedPage = 1;
  let allFeedItems = [];

  document.addEventListener('DOMContentLoaded', async () => {
    await Promise.all([loadFeed(), loadLeaderboard()]);
  });

  async function loadFeed() {
    document.getElementById('feed-loading').style.display = 'block';
    document.getElementById('feed-container').innerHTML = '';
    feedPage = 1;

    const res = await API.getFeed();
    document.getElementById('feed-loading').style.display = 'none';

    if (!res?.ok) {
      showToast(window.i18n.t('error.network'), 'error');
      return;
    }

    allFeedItems = res.data?.results || res.data || [];
    renderFeedPage();
  }

  function renderFeedPage() {
    const container = document.getElementById('feed-container');
    const items = allFeedItems.slice(0, feedPage * 10);

    if (!allFeedItems.length) {
      document.getElementById('feed-empty').classList.remove('d-none');
      return;
    }

    document.getElementById('feed-empty').classList.add('d-none');
    container.innerHTML = items.map(item => renderFeedItem(item)).join('');

    const moreBtn = document.getElementById('load-more-feed');
    moreBtn.classList.toggle('d-none', items.length >= allFeedItems.length);
  }

  function loadMoreFeed() {
    feedPage++;
    renderFeedPage();
  }

  function renderFeedItem(item) {
    const lang = window.i18n.lang;
    const content = lang === 'en' && item.content_en ? item.content_en : item.content_fr;
    const avatarText = (item.actor?.first_name?.[0] || '?').toUpperCase();
    const avatarUrl  = item.actor?.avatar_url;
    const liked = item.is_liked;

    const typeIcon = {
      course_published: '📚',
      badge_earned: '🏆',
      course_completed: '✅',
      comment: '💬',
    }[item.item_type] || '📌';

    return `
    <div class="feed-item" id="feed-${item.id}">
      <div class="feed-avatar" style="${avatarUrl ? '' : 'background:#007a3d;'}">
        ${avatarUrl ? `<img src="${avatarUrl}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" loading="lazy"/>` : avatarText}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.82rem;">
          <a href="profile.html?id=${item.actor?.id}" style="font-weight:700;">
            ${escHtml(item.actor?.first_name||'')} ${escHtml(item.actor?.last_name||'')}
          </a>
          <span style="color:#666;"> ${typeIcon} ${escHtml(content)}</span>
        </div>

        ${item.course ? `
        <a href="course_detail.html?id=${item.course.id}"
           style="display:block;margin-top:.4rem;background:#f8f9fa;padding:.5rem;
                  border-radius:.4rem;font-size:.78rem;color:inherit;text-decoration:none;">
          📚 ${escHtml(item.course.title)}
          <span style="color:#888;">· ${item.course.level} · ${formatSize(item.course.total_size_mb||0)}</span>
        </a>` : ''}

        <div class="d-flex align-items-center gap-3 mt-2" style="font-size:.75rem;color:#888;">
          <button onclick="toggleLike(${item.id})" id="like-btn-${item.id}"
                  style="background:none;border:none;cursor:pointer;font-size:.78rem;
                         color:${liked ? '#ce1126' : '#888'};">
            ${liked ? '❤️' : '🤍'} <span id="like-count-${item.id}">${item.likes_count||0}</span>
          </button>
          <span>${formatDate(item.created_at)}</span>
          <span class="trust-stars" style="font-size:.72rem;">${item.actor?.trust_score_display||''}</span>
        </div>
      </div>
    </div>`;
  }

  async function toggleLike(itemId) {
    const res = await API.likeFeedItem(itemId);
    if (!res?.ok) return;
    const item = allFeedItems.find(i => i.id === itemId);
    if (item) {
      item.is_liked = !item.is_liked;
      item.likes_count = item.is_liked ? item.likes_count + 1 : Math.max(0, item.likes_count - 1);
      const btn = document.getElementById(`like-btn-${itemId}`);
      const cnt = document.getElementById(`like-count-${itemId}`);
      if (btn) { btn.innerHTML = `${item.is_liked ? '❤️' : '🤍'} <span id="like-count-${itemId}">${item.likes_count}</span>`; btn.style.color = item.is_liked ? '#ce1126' : '#888'; }
    }
  }

  async function loadLeaderboard() {
    const res = await API.getLeaderboard();
    const list = document.getElementById('leaderboard-list');
    const users = res?.data?.results || res?.data || [];
    if (!users.length) { list.innerHTML = '<small style="color:#888;">Pas de données.</small>'; return; }
    list.innerHTML = users.slice(0, 10).map((u, i) => `
      <div class="d-flex align-items-center gap-2 mb-2">
        <span style="font-size:.75rem;font-weight:700;color:#999;width:18px;">${i+1}</span>
        <div class="feed-avatar" style="width:28px;height:28px;font-size:.65rem;background:#007a3d;">
          ${(u.first_name?.[0]||'?').toUpperCase()}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            <a href="profile.html?id=${u.id}">${escHtml(u.first_name)} ${escHtml(u.last_name)}</a>
          </div>
          <div class="trust-stars" style="font-size:.65rem;">${u.trust_score_display||'☆'}</div>
        </div>
        <span style="font-size:.72rem;color:#007a3d;font-weight:700;">${u.reputation_score} pts</span>
      </div>`).join('');
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
