<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — Réseau Académique Camerounais</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:#f0f2f5;">

<nav class="navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <span class="flag-cm"></span> Réseau <span>Académique</span>
    </a>
    <button class="lang-toggle" id="lang-toggle-btn">🇬🇧 EN</button>
  </div>
</nav>

<div style="flex:1;display:flex;align-items:center;padding:1rem;">
  <div class="form-card w-100">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;">🎓</div>
      <h1 data-i18n="nav.login">Connexion</h1>
      <p style="color:#666;font-size:.85rem;">
        <span data-i18n="auth.no_account">Pas encore de compte ?</span>
        <a href="register.html" data-i18n="nav.register">Inscription</a>
      </p>
    </div>

    <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email" data-i18n="auth.email">Email</label>
        <input type="email" id="email" class="form-control" required
               autocomplete="email" data-i18n-ph="auth.email"/>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password" data-i18n="auth.password">Mot de passe</label>
        <div class="position-relative">
          <input type="password" id="password" class="form-control" required
                 autocomplete="current-password"/>
          <button type="button" onclick="togglePassword('password')"
                  style="position:absolute;right:.5rem;top:.5rem;background:none;border:none;cursor:pointer;">
            👁
          </button>
        </div>
      </div>

      <button type="submit" class="btn-cam-primary w-100" id="submit-btn" data-i18n="auth.login_btn">
        Se connecter
      </button>
    </form>

    <hr class="my-3"/>
    <p class="text-center" style="font-size:.82rem;color:#888;">
      <a href="#" data-i18n="auth.forgot">Mot de passe oublié ?</a>
    </p>

    <!-- Compte démo -->
    <div class="mt-3 p-2 rounded" style="background:#f8f9fa;font-size:.78rem;color:#555;">
      <strong>Comptes démo :</strong><br/>
      📧 etudiant@elearning.cm / etud123456<br/>
      📧 formateur@elearning.cm / form123456<br/>
      📧 moderateur@elearning.cm / mod123456
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/offline-sync.js"></script>
<script src="js/api.js"></script>
<script>
  // Déjà connecté → redirection
  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    errEl.classList.add('d-none');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      errEl.textContent = 'Veuillez remplir tous les champs. / Please fill in all fields.';
      errEl.classList.remove('d-none');
      return;
    }

    btn.disabled = true;
    btn.textContent = window.i18n.t('btn.loading');

    const res = await API.login(email, password);

    btn.disabled = false;
    btn.textContent = window.i18n.t('auth.login_btn');

    if (res?.ok) {
      const redirect = new URLSearchParams(window.location.search).get('next') || 'index.html';
      window.location.href = redirect;
    } else {
      const msg = res?.data?.detail || res?.data?.message ||
                  'Email ou mot de passe incorrect. / Wrong email or password.';
      errEl.textContent = msg;
      errEl.classList.remove('d-none');
    }
  });

  function togglePassword(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
