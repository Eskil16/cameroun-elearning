[build]
builder      = "nixpacks"
buildCommand = "pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput --clear"

[deploy]
preDeployCommand = "cd backend && python manage.py migrate --noinput"
startCommand     = "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"
healthcheckPath    = "/health/"
healthcheckTimeout = 30
restartPolicyType  = "on_failure"
